services:
  dsh:
    # 路径 B：直接拉取 GHCR 上由 GitHub Actions 自动构建的镜像
    image: ghcr.io/ljtywyh/deepseek-harness:latest
    # 如需本机从源码构建（路径 A），注释上面 image 行并启用下面两行：
    # build: .
    # image: deepseek-harness:local
    container_name: dsh
    # 8080 = nginx 反代（已加 Basic Auth）。不要直接映射 harness 的 3080。
    ports:
      - "8080:8080"
    environment:
      # 必须修改为你自己的强密码；留空则容器生成随机密码并打印到日志
      - DSH_WEB_USER=admin
      - DSH_WEB_PASSWORD=changeme
      # 可选：LLM / 工具所需的密钥在 Web UI 内配置，也可在此预置环境变量
      # - DEEPSEEK_API_KEY=
    volumes:
      # 持久化 harness 数据/配置/会话（位于容器 HOME=/data）
      - dsh-data:/data
    restart: unless-stopped

volumes:
  dsh-data:
