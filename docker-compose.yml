services:
  dsh:
    build: .
    image: deepseek-harness:0.1.0-rc.8
    container_name: dsh
    # 8080 = nginx 反代（已加 Basic Auth）。不要直接映射 harness 的 3080。
    ports:
      - "8080:8080"
    environment:
      # 必须修改为你自己的强密码；留空则容器生成随机密码并打印到日志
      - DSH_WEB_USER=admin
      - DSH_WEB_PASSWORD=changeme
      # 可选：LLM / 工具所需的密钥在 Web UI 内配置，也可在此预置环境变量
      # - DEEPSEEK_API_KEY=
    volumes:
      # 持久化 harness 数据/配置/会话（位于容器 HOME=/data）
      - dsh-data:/data
    restart: unless-stopped

volumes:
  dsh-data:
