# 以非 root (app) 身份运行所需的临时路径全部指向 /tmp
user app;
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /tmp/nginx-access.log;
  error_log  /tmp/nginx-error.log warn;

  client_body_temp_path /tmp/nginx-temp/client;
  proxy_temp_path       /tmp/nginx-temp/proxy;
  fastcgi_temp_path     /tmp/nginx-temp/fastcgi;
  uwsgi_temp_path       /tmp/nginx-temp/uwsgi;
  scgi_temp_path        /tmp/nginx-temp/scgi;

  # 大请求体 / 长连接：harness 会传文件、保持 WebSocket
  client_max_body_size 200m;

  server {
    listen 8080;
    server_name _;

    # 强制鉴权：harness 本身无认证且等价于 RCE，绝不能直接暴露到公网
    auth_basic "DeepSeek Harness";
    auth_basic_user_file /tmp/dsh.htpasswd;

    location / {
      proxy_pass http://127.0.0.1:3080;
      proxy_http_version 1.1;

      # WebSocket 支持（/api/events.mux 等）
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_connect_timeout 10s;
    }
  }
}
